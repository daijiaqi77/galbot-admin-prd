<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD 编辑器 · 后台体系</title>
<style>
  :root{--bg:#0b0d12;--panel:#12151d;--panel2:#171b25;--line:#232838;--text:#e6e9f0;--muted:#8b93a7;--primary:#6e8bff;--accent:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #toolbar .t{font-weight:700;font-size:14px;margin-right:8px}
  #toolbar .v{color:var(--muted);font-size:12px;margin-right:16px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 14px;font-size:12.5px;cursor:pointer}
  button:hover{border-color:var(--primary);color:#fff}
  button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  button.green{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.5);color:var(--green)}
  #panes{flex:1;display:flex;min-height:0}
  #editPane{width:44%;display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:380px}
  #editHead{padding:8px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  #jsonEditor{flex:1;width:100%;background:#0e1017;color:#cdd6f4;border:none;outline:none;padding:14px;font-family:Menlo,Consolas,monospace;font-size:12px;line-height:1.6;resize:none;tab-size:2}
  #previewPane{flex:1;display:flex;flex-direction:column;min-width:0}
  #pvStatus{padding:8px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);min-height:32px}
  #pvStatus.err{color:var(--red)}
  #pvStatus.ok{color:var(--green)}
  #pvRoot{flex:1;display:flex;min-height:0}
  #pvRoot #sidebar{width:200px}
  #pvRoot #main{padding:20px 26px 80px}
  /* 预览区套用查看器样式 */
  #pv-root-style{}
  /* 发布弹窗 */
  #pubMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:center;justify-content:center}
  #pubMask.open{display:flex}
  #pubBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:460px}
  #pubBox h3{font-size:15px;margin-bottom:14px}
  #pubBox label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  #pubBox input{width:100%;background:#0e1017;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:8px 10px;font-size:12.5px}
  #pubBox .row{display:flex;gap:10px}
  #pubBox .row>div{flex:1}
  #pubBox .tip{font-size:11.5px;color:#5b6378;margin-top:8px;line-height:1.6}
  #pubLog{margin-top:12px;font-size:12px;color:var(--accent);white-space:pre-wrap;max-height:120px;overflow:auto}
  .chk{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--muted);font-size:12px}
</style>
<style id="pv-style">
  :root{
    --bg:#0b0d12; --panel:#12151d; --panel2:#171b25; --line:#232838;
    --text:#e6e9f0; --muted:#8b93a7; --primary:#6e8bff; --accent:#22d3ee;
    --green:#34d399; --amber:#fbbf24; --red:#f87171; --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px;line-height:1.7}
  #sidebar{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 0}
  #sidebar .brand{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  #sidebar .brand h1{font-size:15px;font-weight:700}
  #sidebar .brand .ver{font-size:12px;color:var(--muted);margin-top:4px}
  #sidebar a{display:block;padding:7px 18px;color:var(--muted);text-decoration:none;font-size:13px;cursor:pointer;border-left:2px solid transparent}
  #sidebar a:hover{color:var(--text);background:var(--panel2)}
  #sidebar a.active{color:#fff;border-left-color:var(--primary);background:var(--panel2)}
  #sidebar .iface{font-size:12.5px;color:var(--accent);padding:8px 18px 3px;font-weight:600}
  #sidebar .feat{padding-left:32px;font-size:12.5px}
  #main{flex:1;padding:36px 48px 120px;max-width:980px}
  section{display:none}
  h2{font-size:22px;margin-bottom:6px}
  h3{font-size:16px;margin:28px 0 10px;color:#fff}
  h4{font-size:14px;margin:18px 0 8px;color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:14px 0}
  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .tag.done{background:rgba(52,211,153,.14);color:var(--green)}
  .tag.doing{background:rgba(251,191,36,.14);color:var(--amber)}
  .tag.plan{background:rgba(139,147,167,.16);color:var(--muted)}
  .tag.mode{background:rgba(110,139,255,.15);color:#a7baff;margin:0 6px 6px 0}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--panel2);color:#cdd3e4;font-weight:600;white-space:nowrap}
  ul,ol{padding-left:22px;margin:8px 0}
  li{margin:4px 0}
  code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12.5px;color:var(--accent)}
  .md p{margin:8px 0}
  .md strong{color:#fff}
  .proto{display:inline-flex;align-items:center;gap:6px;margin:6px 0;padding:7px 14px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);color:var(--accent);border-radius:8px;text-decoration:none;font-size:13px;cursor:pointer}
  .proto:hover{background:rgba(34,211,238,.18)}
  .mode-card{border-left:3px solid var(--primary);background:var(--panel2);border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0}
  .mode-card .flow{margin-top:8px;font-size:12.5px;color:var(--muted)}
  .mode-card .flow b{color:var(--amber)}
  .flow{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
  .flow-node{background:#1b2030;border:1px solid var(--primary);color:#e6e9f0;border-radius:8px;padding:8px 16px;font-size:12.5px;text-align:center;max-width:420px}
  .flow-node.flow-diamond{background:rgba(110,139,255,.12);border-color:var(--accent);border-radius:14px;font-weight:600}
  .flow-arrow{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:12px;line-height:1.3}
  .flow-arrow .flow-label{color:var(--amber);font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:1px 9px;margin-bottom:1px}
  .flow-arrow .flow-line{color:var(--primary);font-size:13px}
  .flow-text{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .updated{position:fixed;right:18px;bottom:14px;font-size:11.5px;color:#555c70}
  </style>
</head>
<body>
<div id="toolbar">
  <span class="t">后台体系 PRD 编辑器</span>
  <span class="v" id="verLabel"></span>
  <button onclick="applyData(true)">▶ 应用并预览</button>
  <button onclick="downloadData()">⬇ 导出 prd-data.js</button>
  <button onclick="downloadViewer()">⬇ 生成查看版 HTML</button>
  <button class="green" onclick="openPub()">🚀 发布到 GitHub Pages</button>
</div>
<div id="panes">
  <div id="editPane">
    <div id="editHead"><span>prd-data.js（JSON，编辑后点"应用并预览"）</span><span id="charCount"></span></div>
    <textarea id="jsonEditor" spellcheck="false"></textarea>
  </div>
  <div id="previewPane">
    <div id="pvStatus">预览区（只读，与发布的查看版渲染完全一致）</div>
    <div id="pvRoot">
      <nav id="sidebar" class="pv-sidebar">
        <div class="brand"><h1>PRD</h1><div class="ver"></div></div>
        <div id="navTree"></div>
      </nav>
      <main id="main" class="pv-main"></main>
      <div class="updated"></div>
    </div>
  </div>
</div>

<div id="pubMask">
  <div id="pubBox">
    <h3>发布到 GitHub Pages</h3>
    <div class="row">
      <div><label>GitHub 用户名</label><input id="ghUser" placeholder="如 daijiaqi" value="daijiaqi77"></div>
      <div><label>仓库名</label><input id="ghRepo" placeholder="如 galbot-admin-prd" value="galbot-admin-prd"></div>
    </div>
    <label>Personal Access Token（需 repo 权限，仅存本机 localStorage，不会写入发布文件）</label>
    <input id="ghToken" type="password" placeholder="ghp_xxxxxxxxxxxx">
    <div class="row">
      <div><label>发布文件路径</label><input id="ghPath" value="index.html"></div>
      <div><label>提交信息</label><input id="ghMsg" value="更新 PRD 查看版"></div>
    </div>
    <label class="chk"><input type="checkbox" id="ghPrivate"> 私有仓库（Pages 需账号支持，公开仓库可直接访问）</label>
    <div class="tip">首次发布会自动：创建仓库（如不存在）→ 上传 index.html → 启用 GitHub Pages。Token 90 天建议更换。</div>
    <div id="pubLog"></div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closePub()">取消</button>
      <button class="primary" id="pubBtn" onclick="publish()">发布</button>
    </div>
  </div>
</div>

<script>window.PRD_DATA = {

    "stateMachine": "```mermaid\nflowchart TD\n  A[\"提交手机号、验证码、协议\"] --> B{\"统一用户平台\"}\n  B -->|新手机号| C[\"自动注册，使用中 FREE\"]\n  B -->|老手机号| D[\"直接登录，使用中 FREE\"]\n  C --> E[\"完善姓名与出生日期\"]\n  D --> E\n  E -->|任一缺失| F[\"横幅常驻、全站锁定，仅两项修改可用\"]\n  F -->|两项补齐| G{\"按周岁判定\"}\n  E -->|两项已齐| G\n  G -->|满18岁| H[\"正常\"]\n  G -->|14至17岁| I[\"未成年模式，功能可用加琥珀标识\"]\n  G -->|不满14岁| J[\"限制使用，置灰加红条\"]\n  J -->|改至合规年龄，豁免冷却| G\n  K[\"管理员操作\"] -->|小窗填原因禁用| L[\"禁用，不可登录\"]\n  L -->|恢复，无需理由| K\n  K -->|二次确认删除| M[\"账号移除\"]\n```\n\n**关键规则：**\n- 不存在登录环节的资料拦截；姓名、出生日期在登录后采集。\n- 年龄按**周岁**严格计算（生日当天满岁）；出生日期修改后重新判定。\n- 角色、出生日期正常修改受 30 天冷却限制（限制使用态改出生日期除外）。\n- 年龄模式是**功能使用层**约束，管理侧账号状态是**平台管理层**状态，两者独立判定、独立解除，可并存。",

ound:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}\n  .updated{position:fixed;right:18px;bottom:14px;font-size:11.5px;color:#555c70}\n  `;\n\n  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}\n  /* 内置极简 Markdown：支持 **加粗**、`代码`、换行、- / 1. 列表；不依赖任何外部库 */\n  function inlineMd(s){\n    return esc(s==null?'':s)\n      .replace(/`([^`]+)`/g,'<code>$1</code>')\n      .replace(/\\*\\*([^*]+)\\*\\*/g,'<strong>$1</strong>');\n  }\n  function md(s){\n    if(s==null) return '';\n    const lines=String(s).replace(/\\r/g,'').split('\\n');\n    let html='', inUl=false, inOl=false;\n    function closeLists(){ if(inUl){html+='</ul>';inUl=false;} if(inOl){html+='</ol>';inOl=false;} }\n    lines.forEach(line=>{\n      const t=line.trim();\n      if(!t){closeLists();return;}\n      let m=t.match(/^[-*]\\s+(.+)/);\n      if(m){ if(inOl){html+='</ol>';inOl=false;} if(!inUl){html+='<ul>';inUl=true;} html+='<li>'+inlineMd(m[1])+'</li>'; return; }\n      m=t.match(/^\\d+[.、]\\s*(.+)/);\n      if(m){ if(inUl){html+='</ul>';inUl=false;} if(!inOl){html+='<ol>';inOl=true;} html+='<li>'+inlineMd(m[1])+'</li>'; return; }\n      closeLists(); html+='<p>'+inlineMd(t)+'</p>';\n    });\n    closeLists();\n    return html;\n  }\n  function statusTag(st){const m={'已完成':'done','开发中':'doing','规划中':'plan'};return '<span class=\"tag '+(m[st]||'plan')+'\">'+esc(st)+'</span>';}\n\n  /* 纯 CSS 流程图：解析简易 flowchart TD 文本（节点 []判定{} + 边标签 |xx|），无外部依赖 */\n  function parseFlow(src){\n    const nodes={}, edges=[];\n    String(src).replace(/```mermaid|```|flowchart\\s+TD/g,'').split('\\n').forEach(line=>{\n      const t=line.trim(); if(!t) return;\n      const m=t.match(/^([A-Za-z0-9_]+)(\\[\\[|\\[|\\{\\{|\\{)?\\s*\"?([^\"\\]]*?)\"?\\s*(?:\\]\\]|\\]|\\}\\}|\\})?\\s*-->\\s*(?:\\|([^|]*)\\|\\s*)?([A-Za-z0-9_]+)(\\[\\[|\\[|\\{\\{|\\{)?\\s*\"?([^\"\\]]*?)\"?\\s*(?:\\]\\]|\\]|\\}\\}|\\})?\\s*$/);\n      if(!m) return;\n      const fid=m[1], fo=m[2], fLabel=m[3], el=m[4], tid=m[5], to=m[6], tLabel=m[7];\n      if(fo&&fLabel!=null) nodes[fid]={label:fLabel.trim(),type:(fo==='{'||fo==='{{')?'diamond':'box'};\n      if(to&&tLabel!=null&&tLabel.trim()) nodes[tid]={label:tLabel.trim(),type:(to==='{'||to==='{{')?'diamond':'box'};\n      edges.push({from:fid,to:tid,label:(el||'').trim()});\n    });\n    return {nodes,edges};\n  }\n  function flowHtml(src){\n    const {nodes,edges}=parseFlow(src);\n    if(!edges.length) return '<pre class=\"flow-text\">'+esc(String(src).replace(/```mermaid|```|flowchart\\s+TD/g,'').trim())+'</pre>';\n\n    // 分层（最长路径），回环边标记为 back\n    const preds={}; edges.forEach(e=>(preds[e.to]=preds[e.to]||[]).push(e));\n    const layer={}, back=new Set(), state={};\n    const order=[]; edges.forEach(e=>{[e.from,e.to].forEach(id=>{if(!order.includes(id))order.push(id);});});\n    function dfs(id){\n      if(state[id]===2) return layer[id];\n      if(state[id]===1){ return null; } // 回环\n      state[id]=1;\n      let lvl=0;\n      (preds[id]||[]).forEach(e=>{\n        const pl=dfs(e.from);\n        if(pl===null){ back.add(e.from+'>'+e.to); return; }\n        lvl=Math.max(lvl,pl+1);\n      });\n      state[id]=2; layer[id]=lvl; return lvl;\n    }\n    order.forEach(id=>dfs(id));\n    const maxLayer=Math.max.apply(null,Object.values(layer));\n    const rows=Array.from({length:maxLayer+1},()=>[]);\n    order.forEach(id=>{ if(layer[id]!=null) rows[layer[id]].push(id); });\n\n    // 节点尺寸（中英文混排估算）\n    const measure=s=>{ let w=0; for(const ch of s){w += /[\\u4e00-\\u9fff，。、：；（）]/.test(ch)?13:7.5;} return {w:Math.max(76,Math.min(240,w+28)),h:36}; };\n    const NW=180, COL=250, ROWH=120, TOP=20;\n    const pos={};\n    rows.forEach((ids,r)=>{\n      ids.forEach((id,c)=>{\n        const n=nodes[id]||{label:id,type:'box'};\n        const sz=measure(n.label);\n        pos[id]={x:c*COL+(COL-sz.w)/2,y:r*ROWH+TOP,w:sz.w,h:sz.h,cx:c*COL+COL/2,cy:r*ROWH+TOP+sz.h/2};\n      });\n    });\n    const cols=Math.max.apply(null,rows.map(r=>r.length));\n    const svgW=Math.max(560,cols*COL+40);\n    const svgH=(maxLayer+1)*ROWH+30;\n\n    let s='<svg class=\"flow-svg\" viewBox=\"0 0 '+svgW+' '+svgH+'\" width=\"100%\" style=\"max-width:'+svgW+'px\" xmlns=\"http://www.w3.org/2000/svg\">';\n    s+='<defs><marker id=\"arr\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L8,3 L0,6 Z\" fill=\"#6e8bff\"/></marker>'+\n       '<marker id=\"arrB\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L8,3 L0,6 Z\" fill=\"#fbbf24\"/></marker></defs>';\n    // 边\n    edges.forEach(e=>{\n      const a=pos[e.from],b=pos[e.to]; if(!a||!b) return;\n      const isBack=back.has(e.from+'>'+e.to);\n      const col=isBack?'#fbbf24':'#6e8bff';\n      if(isBack){\n        const x1=a.x+a.w+4,y1=a.cy,x2=b.x+b.w+4,y2=b.cy;\n        const mx=Math.max(x1,x2)+40;\n        s+='<path d=\"M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'\" fill=\"none\" stroke=\"'+col+'\" stroke-width=\"1.5\" stroke-dasharray=\"5 3\" marker-end=\"url(#arrB)\"/>';\n        if(e.label) s+='<text x=\"'+(mx+4)+'\" y=\"'+((y1+y2)/2)+'\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\" transform=\"rotate(-90 '+(mx+4)+' '+((y1+y2)/2)+')\">'+esc(e.label)+'</text>';\n      }else{\n        const sameLayer=a.cy===b.cy;\n        if(sameLayer){\n          s+='<path d=\"M'+(a.x+a.w)+' '+a.cy+' L'+b.x+' '+b.cy+'\" fill=\"none\" stroke=\"'+col+'\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>';\n        }else{\n          const y1=a.y+a.h,y2=b.y,x1=a.cx,x2=b.cx;\n          const my=(y1+y2)/2;\n          s+='<path d=\"M'+x1+' '+y1+' C'+x1+' '+my+' '+x2+' '+my+' '+x2+' '+y2+'\" fill=\"none\" stroke=\"'+col+'\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>';\n        }\n        if(e.label){\n          const ly=a.y+a.h+(b.y-(a.y+a.h))/2;\n          const tw=e.label.length*12+10;\n          s+='<rect x=\"'+(a.cx-tw/2)+'\" y=\"'+(ly-10)+'\" width=\"'+tw+'\" height=\"17\" rx=\"8\" fill=\"#171b25\" stroke=\"#232838\"/>';\n          s+='<text x=\"'+a.cx+'\" y=\"'+ly+3+'\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">'+esc(e.label)+'</text>';\n        }\n      }\n    });\n    // 节点\n    order.forEach(id=>{\n      const p=pos[id]; if(!p) return;\n      const n=nodes[id]||{label:id,type:'box'};\n      if(n.type==='diamond'){\n        const cx=p.cx,cy=p.cy,w=p.w/2+14,h=p.h/2+8;\n        s+='<polygon points=\"'+cx+','+(cy-h)+' '+(cx+w)+','+cy+' '+cx+','+(cy+h)+' '+(cx-w)+','+cy+'\" fill=\"rgba(34,211,238,.1)\" stroke=\"#22d3ee\" stroke-width=\"1.4\"/>';\n      }else{\n        s+='<rect x=\"'+p.x+'\" y=\"'+p.y+'\" width=\"'+p.w+'\" height=\"'+p.h+'\" rx=\"8\" fill=\"#1b2030\" stroke=\"#6e8bff\" stroke-width=\"1.3\"/>';\n      }\n      // 文本换行（约 14 个汉字/行）\n      const maxChars=Math.max(8,Math.floor((p.w-16)/13));\n      const lines=wrapText(n.label,maxChars);\n      lines.forEach((ln,i)=>{\n        const yy=p.cy-(lines.length-1)*8+i*16+4;\n        s+='<text x=\"'+p.cx+'\" y=\"'+yy+'\" fill=\"#e6e9f0\" font-size=\"12.5\" text-anchor=\"middle\">'+esc(ln)+'</text>';\n      });\n    });\n    s+='</svg><div class=\"sub\" style=\"margin-top:2px\">实线：主流程　<span style=\"color:#fbbf24\">黄色虚线：回环（限制使用态改龄解封）</span></div>';\n    return '<div class=\"flow-wrap\">'+s+'</div>';\n  }\n  function wrapText(s,n){\n    const out=[]; let cur='';\n    for(const ch of s){ cur+=ch; let w=0; for(const c of cur) w+=/[\\u4e00-\\u9fff，。、：；（）]/.test(c)?1:0.6;\n      if(w>=n){out.push(cur);cur='';} }\n    if(cur)out.push(cur); return out.length?out:[s];\n  }\n\n  function buildSections(D){\n    const sections = {};\n    sections['common'] = () => {\n      const c = D.common;\n      let h = '<h2>跨界面通用规则</h2><div class=\"sub\">三模块共用的数据底座、状态机、异常处理与一期范围</div>';\n      h += '<div class=\"card md\">'+md(c.overview)+'</div>';\n      h += '<h3>产品目标</h3><ul>'+c.productGoals.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';\n      h += '<h3>统一用户数据模型（'+c.dataModel.length+' 个字段）</h3>';\n      h += '<table><tr><th>#</th><th>字段</th><th>类型 / 取值</th><th>默认态</th><th>说明</th></tr>';\n      h += c.dataModel.map(f=>'<tr><td>'+f.no+'</td><td><b>'+esc(f.field)+'</b></td><td>'+esc(f.type)+'</td><td>'+esc(f.def)+'</td><td>'+esc(f.note)+'</td></tr>').join('');\n      h += '</table><h3>三模块字段权限矩阵</h3><table><tr><th>字段</th><th>登录注册</th><th>个人中心（本人）</th><th>管理员用户列表</th></tr>';\n      h += c.fieldMatrix.map(r=>'<tr><td><b>'+esc(r.field)+'</b></td><td>'+esc(r.login)+'</td><td>'+esc(r.self)+'</td><td>'+esc(r.admin)+'</td></tr>').join('');\n      h += '</table>';\n      h += '<h3>账号状态机</h3><div class=\"card\">'+flowHtml(c.stateMachine)+'</div>';\n      h += '<h3>异常与边界</h3><table><tr><th>场景</th><th>处理</th></tr>';\n      h += c.exceptions.map(r=>'<tr><td>'+esc(r.scene)+'</td><td>'+esc(r.handle)+'</td></tr>').join('')+'</table>';\n      h += '<h3>数据埋点建议</h3><ul>'+c.tracking.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';\n      h += '<h3>第一版范围</h3><div class=\"card\"><h4 style=\"color:var(--green)\">做</h4><ul>'+c.scope.do.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h4 style=\"color:var(--red);margin-top:14px\">不做</h4><ul>'+c.scope.dont.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';\n      h += '<h3>待评审确认项</h3><ol>'+c.openQuestions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';\n      return h;\n    };\n\n    function protoBlock(p){\n      if(!p||!p.url) return '<div class=\"sub\">（无独立原型）</div>';\n      return '<a class=\"proto\" target=\"_blank\" href=\"'+p.url+'\">🔗 查看界面原型（高保真）&nbsp;<span style=\"color:#5b6378\">'+esc(p.anchor||'')+'</span></a>'+\n        (p.note?'<div class=\"sub\" style=\"margin:4px 0 0\">'+esc(p.note)+'</div>':'');\n    }\n    function featureModes(f){\n      const keys=Object.keys(f.modes||{});\n      if(!keys.length) return '';\n      let h='<h4>功能模式</h4>';\n      keys.forEach(k=>{const m=f.modes[k];\n        h+='<div class=\"mode-card\"><span class=\"tag mode\">'+esc(m.name)+'</span><div class=\"md\">'+md(m.description)+'</div>'+\n          (m.flow?'<div class=\"flow\"><b>流程：</b>'+esc(m.flow)+'</div>':'')+'</div>';\n      });\n      return h;\n    }\n    function featureBlock(f){\n      let h='<div class=\"card\"><h4 style=\"color:#fff;font-size:14.5px\">'+esc(f.name)+'</h4>';\n      if(f.prd.overview) h+='<div class=\"md\">'+md(f.prd.overview)+'</div>';\n      if(f.prd.requirements&&f.prd.requirements.length) h+='<ul style=\"margin-top:6px\">'+f.prd.requirements.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>';\n      h+=featureModes(f)+'</div>';\n      return h;\n    }\n\n    const ifaces=[['login',D.login],['center',D.center],['admin',D.admin]];\n    ifaces.forEach(([key,I])=>{\n      sections[key]=()=>{\n        const p=I.prd;\n        let h='<h2>'+esc(I.name)+statusTag(I.status)+'</h2><div class=\"sub\">界面 ID：'+esc(I.id)+'</div>';\n        h+='<h3>功能概述</h3><div class=\"card md\">'+md(p.overview)+'</div>';\n        h+='<h3>用户故事</h3><div class=\"card\"><i>'+esc(p.userStory)+'</i></div>';\n        h+='<h3>需求列表</h3><ul>'+p.requirements.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>';\n        h+='<h3>页面布局</h3><div class=\"card md\">'+md(p.layout)+'</div>';\n        h+='<h3>界面原型</h3><div class=\"card\">'+protoBlock(I.prototype)+'</div>';\n        h+='<h3>异常处理</h3><ul>'+p.edgeCases.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>';\n        h+='<h3>功能清单（'+Object.keys(I.features).length+' 个功能）</h3>';\n        Object.keys(I.features).forEach(fk=>{h+=featureBlock(I.features[fk]);});\n        return h;\n      };\n      Object.keys(I.features).forEach(fk=>{\n        const f=I.features[fk];\n        sections[key+'-'+fk]=()=>'<h2>'+esc(I.name)+' / '+esc(f.name)+'</h2><div class=\"sub\">'+esc(I.id)+' → '+esc(f.id)+'</div>'+\n          featureBlock(f)+'<a class=\"proto\" style=\"margin-top:14px\" data-back=\"'+key+'\">← 返回 '+esc(I.name)+'</a>';\n      });\n    });\n    return sections;\n  }\n\n  function mount(D, opts){\n    opts = opts || {};\n    const root=opts.rootId?document.getElementById(opts.rootId):document;\n    const sidebar=root.querySelector('.pv-sidebar, #sidebar');\n    const main=root.querySelector('.pv-main, #main');\n    sidebar.querySelector('.brand h1').textContent=D.meta.name;\n    sidebar.querySelector('.brand .ver').textContent=D.meta.version+' · 更新于 '+D.meta.updatedAt;\n    const tip=root.querySelector('.updated'); if(tip) tip.textContent=D.meta.owner+' · '+D.meta.sourceDoc;\n\n    const sections=buildSections(D);\n    const ifaces=[['login',D.login],['center',D.center],['admin',D.admin]];\n    let nh='<a data-t=\"common\">📐 通用规则</a>';\n    ifaces.forEach(([key,I])=>{\n      nh+='<div class=\"iface\">'+esc(I.name)+'</div>';\n      nh+='<a class=\"feat\" data-t=\"'+key+'\">界面总览</a>';\n      Object.keys(I.features).forEach(fk=>{nh+='<a class=\"feat\" data-t=\"'+key+'-'+fk+'\">'+esc(I.features[fk].name)+'</a>';});\n    });\n    const tree=sidebar.querySelector('#navTree');\n    tree.innerHTML=nh;\n\n    function show(t){\n      main.innerHTML=sections[t]?sections[t]():sections['common']();\n      tree.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.t===t));\n      main.scrollTop?main.scrollTop=0:window.scrollTo(0,0);\n    }\n    tree.onclick=e=>{const a=e.target.closest('a');if(a&&a.dataset.t){if(opts.onNavigate)opts.onNavigate(a.dataset.t);else location.hash=a.dataset.t;}};\n    main.addEventListener('click',e=>{\n      const b=e.target.closest('[data-back]');if(b){if(opts.onNavigate)opts.onNavigate(b.dataset.back);else location.hash=b.dataset.back;}\n    });\n    if(opts.onNavigate){opts.onNavigate('common');}\n    else{\n      function route(){show(location.hash.slice(1)||'common');}\n      window.addEventListener('hashchange',route);route();\n    }\n    return {show};\n  }\n\n  window.PRD_VIEWER={css:CSS,mount:mount,buildSections:buildSections};\n})();\n";</script>
<script>/* PRD 查看器单一渲染源（编辑版与查看版共用，禁止在两处分别维护） */
(function () {
  const CSS = `
  :root{
    --bg:#0b0d12; --panel:#12151d; --panel2:#171b25; --line:#232838;
    --text:#e6e9f0; --muted:#8b93a7; --primary:#6e8bff; --accent:#22d3ee;
    --green:#34d399; --amber:#fbbf24; --red:#f87171; --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  .flow-arrow .flow-line{color:var(--primary);font-size:13px}
  .flow-text{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}

  `;

  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  /* 内置极简 Markdown：支持 **加粗**、`代码`、换行、- / 1. 列表；不依赖任何外部库 */
  function inlineMd(s){
    return esc(s==null?'':s)
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  }
  function md(s){
    if(s==null) return '';
    const lines=String(s).replace(/\r/g,'').split('\n');
    let html='', inUl=false, inOl=false;
    function closeLists(){ if(inUl){html+='</ul>';inUl=false;} if(inOl){html+='</ol>';inOl=false;} }
    lines.forEach(line=>{
      const t=line.trim();
      if(!t){closeLists();return;}
      let m=t.match(/^[-*]\s+(.+)/);
      if(m){ if(inOl){html+='</ol>';inOl=false;} if(!inUl){html+='<ul>';inUl=true;} html+='<li>'+inlineMd(m[1])+'</li>'; return; }
      m=t.match(/^\d+[.、]\s*(.+)/);
      if(m){ if(inUl){html+='</ul>';inUl=false;} if(!inOl){html+='<ol>';inOl=true;} html+='<li>'+inlineMd(m[1])+'</li>'; return; }
      closeLists(); html+='<p>'+inlineMd(t)+'</p>';
    });
    closeLists();
    return html;
  }
  function statusTag(st){const m={'已完成':'done','开发中':'doing','规划中':'plan'};return '<span class="tag '+(m[st]||'plan')+'">'+esc(st)+'</span>';}

  /* 纯 CSS 流程图：解析简易 flowchart TD 文本（节点 []判定{} + 边标签 |xx|），无外部依赖 */
  function parseFlow(src){
    const nodes={}, edges=[];
    String(src).replace(/```mermaid|```|flowchart\s+TD/g,'').split('\n').forEach(line=>{
      const t=line.trim(); if(!t) return;
      const m=t.match(/^([A-Za-z0-9_]+)(\[\[|\[|\{\{|\{)?\s*"?([^"\]]*?)"?\s*(?:\]\]|\]|\}\}|\})?\s*-->\s*(?:\|([^|]*)\|\s*)?([A-Za-z0-9_]+)(\[\[|\[|\{\{|\{)?\s*"?([^"\]]*?)"?\s*(?:\]\]|\]|\}\}|\})?\s*$/);
      if(!m) return;
      const fid=m[1], fo=m[2], fLabel=m[3], el=m[4], tid=m[5], to=m[6], tLabel=m[7];
      if(fo&&fLabel!=null) nodes[fid]={label:fLabel.trim(),type:(fo==='{'||fo==='{{')?'diamond':'box'};
      if(to&&tLabel!=null&&tLabel.trim()) nodes[tid]={label:tLabel.trim(),type:(to==='{'||to==='{{')?'diamond':'box'};
      edges.push({from:fid,to:tid,label:(el||'').trim()});
    });
    return {nodes,edges};
  }
  function flowHtml(src){
    const {nodes,edges}=parseFlow(src);
    if(!edges.length) return '<pre class="flow-text">'+esc(String(src).replace(/```mermaid|```|flowchart\s+TD/g,'').trim())+'</pre>';

    // 分层（最长路径），回环边标记为 back
    const preds={}; edges.forEach(e=>(preds[e.to]=preds[e.to]||[]).push(e));
    const layer={}, back=new Set(), state={};
    const order=[]; edges.forEach(e=>{[e.from,e.to].forEach(id=>{if(!order.includes(id))order.push(id);});});
    function dfs(id){
      if(state[id]===2) return layer[id];
      if(state[id]===1){ return null; } // 回环
      state[id]=1;
      let lvl=0;
      (preds[id]||[]).forEach(e=>{
        const pl=dfs(e.from);
        if(pl===null){ back.add(e.from+'>'+e.to); return; }
        lvl=Math.max(lvl,pl+1);
      });
      state[id]=2; layer[id]=lvl; return lvl;
    }
    order.forEach(id=>dfs(id));
    const maxLayer=Math.max.apply(null,Object.values(layer));
    const rows=Array.from({length:maxLayer+1},()=>[]);
    order.forEach(id=>{ if(layer[id]!=null) rows[layer[id]].push(id); });

    // 节点尺寸（中英文混排估算）
    const measure=s=>{ let w=0; for(const ch of s){w += /[\u4e00-\u9fff，。、：；（）]/.test(ch)?13:7.5;} return {w:Math.max(76,Math.min(240,w+28)),h:36}; };
    const NW=180, COL=250, ROWH=120, TOP=20;
    const pos={};
    rows.forEach((ids,r)=>{
      ids.forEach((id,c)=>{
        const n=nodes[id]||{label:id,type:'box'};
        const sz=measure(n.label);
        pos[id]={x:c*COL+(COL-sz.w)/2,y:r*ROWH+TOP,w:sz.w,h:sz.h,cx:c*COL+COL/2,cy:r*ROWH+TOP+sz.h/2};
      });
    });
    const cols=Math.max.apply(null,rows.map(r=>r.length));
    const svgW=Math.max(560,cols*COL+40);
    const svgH=(maxLayer+1)*ROWH+30;

    let s='<svg class="flow-svg" viewBox="0 0 '+svgW+' '+svgH+'" width="100%" style="max-width:'+svgW+'px" xmlns="http://www.w3.org/2000/svg">';
    s+='<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6e8bff"/></marker>'+
       '<marker id="arrB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/></marker></defs>';
    // 边
    edges.forEach(e=>{
      const a=pos[e.from],b=pos[e.to]; if(!a||!b) return;
      const isBack=back.has(e.from+'>'+e.to);
      const col=isBack?'#fbbf24':'#6e8bff';
      if(isBack){
        const x1=a.x+a.w+4,y1=a.cy,x2=b.x+b.w+4,y2=b.cy;
        const mx=Math.max(x1,x2)+40;
        s+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrB)"/>';
        if(e.label) s+='<text x="'+(mx+4)+'" y="'+((y1+y2)/2)+'" fill="#fbbf24" font-size="11" text-anchor="middle" transform="rotate(-90 '+(mx+4)+' '+((y1+y2)/2)+')">'+esc(e.label)+'</text>';
      }else{
        const sameLayer=a.cy===b.cy;
        if(sameLayer){
          s+='<path d="M'+(a.x+a.w)+' '+a.cy+' L'+b.x+' '+b.cy+'" fill="none" stroke="'+col+'" stroke-width="1.5" marker-end="url(#arr)"/>';
        }else{
          const y1=a.y+a.h,y2=b.y,x1=a.cx,x2=b.cx;
          const my=(y1+y2)/2;
          s+='<path d="M'+x1+' '+y1+' C'+x1+' '+my+' '+x2+' '+my+' '+x2+' '+y2+'" fill="none" stroke="'+col+'" stroke-width="1.5" marker-end="url(#arr)"/>';
        }
        if(e.label){
          const ly=a.y+a.h+(b.y-(a.y+a.h))/2;
          const tw=e.label.length*12+10;
          s+='<rect x="'+(a.cx-tw/2)+'" y="'+(ly-10)+'" width="'+tw+'" height="17" rx="8" fill="#171b25" stroke="#232838"/>';
          s+='<text x="'+a.cx+'" y="'+ly+3+'" fill="#fbbf24" font-size="11" text-anchor="middle">'+esc(e.label)+'</text>';
        }
      }
    });
    // 节点
    order.forEach(id=>{
      const p=pos[id]; if(!p) return;
      const n=nodes[id]||{label:id,type:'box'};
      if(n.type==='diamond'){
        const cx=p.cx,cy=p.cy,w=p.w/2+14,h=p.h/2+8;
        s+='<polygon points="'+cx+','+(cy-h)+' '+(cx+w)+','+cy+' '+cx+','+(cy+h)+' '+(cx-w)+','+cy+'" fill="rgba(34,211,238,.1)" stroke="#22d3ee" stroke-width="1.4"/>';
      }else{
        s+='<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="8" fill="#1b2030" stroke="#6e8bff" stroke-width="1.3"/>';
      }
      // 文本换行（约 14 个汉字/行）
      const maxChars=Math.max(8,Math.floor((p.w-16)/13));
      const lines=wrapText(n.label,maxChars);
      lines.forEach((ln,i)=>{
        const yy=p.cy-(lines.length-1)*8+i*16+4;
        s+='<text x="'+p.cx+'" y="'+yy+'" fill="#e6e9f0" font-size="12.5" text-anchor="middle">'+esc(ln)+'</text>';
      });
    });
    s+='</svg><div class="sub" style="margin-top:2px">实线：主流程　<span style="color:#fbbf24">黄色虚线：回环（限制使用态改龄解封）</span></div>';
    return '<div class="flow-wrap">'+s+'</div>';
  }
  function wrapText(s,n){
    const out=[]; let cur='';
    for(const ch of s){ cur+=ch; let w=0; for(const c of cur) w+=/[\u4e00-\u9fff，。、：；（）]/.test(c)?1:0.6;
      if(w>=n){out.push(cur);cur='';} }
    if(cur)out.push(cur); return out.length?out:[s];
  }

  function buildSections(D){
    const sections = {};
    sections['common'] = () => {
      const c = D.common;
      let h = '<h2>跨界面通用规则</h2><div class="sub">三模块共用的数据底座、状态机、异常处理与一期范围</div>';
      h += '<div class="card md">'+md(c.overview)+'</div>';
      h += '<h3>产品目标</h3><ul>'+c.productGoals.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
      h += '<h3>统一用户数据模型（'+c.dataModel.length+' 个字段）</h3>';
      h += '<table><tr><th>#</th><th>字段</th><th>类型 / 取值</th><th>默认态</th><th>说明</th></tr>';
      h += c.dataModel.map(f=>'<tr><td>'+f.no+'</td><td><b>'+esc(f.field)+'</b></td><td>'+esc(f.type)+'</td><td>'+esc(f.def)+'</td><td>'+esc(f.note)+'</td></tr>').join('');
      h += '</table><h3>三模块字段权限矩阵</h3><table><tr><th>字段</th><th>登录注册</th><th>个人中心（本人）</th><th>管理员用户列表</th></tr>';
      h += c.fieldMatrix.map(r=>'<tr><td><b>'+esc(r.field)+'</b></td><td>'+esc(r.login)+'</td><td>'+esc(r.self)+'</td><td>'+esc(r.admin)+'</td></tr>').join('');
      h += '</table>';
      h += '<h3>账号状态机</h3><div class="card">'+flowHtml(c.stateMachine)+'</div>';
      h += '<h3>异常与边界</h3><table><tr><th>场景</th><th>处理</th></tr>';
      h += c.exceptions.map(r=>'<tr><td>'+esc(r.scene)+'</td><td>'+esc(r.handle)+'</td></tr>').join('')+'</table>';
      h += '<h3>数据埋点建议</h3><ul>'+c.tracking.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
      h += '<h3>第一版范围</h3><div class="card"><h4 style="color:var(--green)">做</h4><ul>'+c.scope.do.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h4 style="color:var(--red);margin-top:14px">不做</h4><ul>'+c.scope.dont.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
      h += '<h3>待评审确认项</h3><ol>'+c.openQuestions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
      return h;
    };

    function protoBlock(p){
      if(!p||!p.url) return '<div class="sub">（无独立原型）</div>';
      return '<a class="proto" target="_blank" href="'+p.url+'">🔗 查看界面原型（高保真）&nbsp;<span style="color:#5b6378">'+esc(p.anchor||'')+'</span></a>'+
        (p.note?'<div class="sub" style="margin:4px 0 0">'+esc(p.note)+'</div>':'');
    }
    function featureModes(f){
      const keys=Object.keys(f.modes||{});
      if(!keys.length) return '';
      let h='<h4>功能模式</h4>';
      keys.forEach(k=>{const m=f.modes[k];
        h+='<div class="mode-card"><span class="tag mode">'+esc(m.name)+'</span><div class="md">'+md(m.description)+'</div>'+
          (m.flow?'<div class="flow"><b>流程：</b>'+esc(m.flow)+'</div>':'')+'</div>';
      });
      return h;
    }
    function featureBlock(f){
      let h='<div class="card"><h4 style="color:#fff;font-size:14.5px">'+esc(f.name)+'</h4>';
      if(f.prd.overview) h+='<div class="md">'+md(f.prd.overview)+'</div>';
      if(f.prd.requirements&&f.prd.requirements.length) h+='<ul style="margin-top:6px">'+f.prd.requirements.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>';
      h+=featureModes(f)+'</div>';
      return h;
    }

    const ifaces=[['login',D.login],['center',D.center],['admin',D.admin]];
    ifaces.forEach(([key,I])=>{
      sections[key]=()=>{
        const p=I.prd;
        let h='<h2>'+esc(I.name)+statusTag(I.status)+'</h2><div class="sub">界面 ID：'+esc(I.id)+'</div>';
        h+='<h3>功能概述</h3><div class="card md">'+md(p.overview)+'</div>';
        h+='<h3>用户故事</h3><div class="card"><i>'+esc(p.userStory)+'</i></div>';
        h+='<h3>需求列表</h3><ul>'+p.requirements.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>';
        h+='<h3>页面布局</h3><div class="card md">'+md(p.layout)+'</div>';
        h+='<h3>界面原型</h3><div class="card">'+protoBlock(I.prototype)+'</div>';
        h+='<h3>异常处理</h3><ul>'+p.edgeCases.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>';
        h+='<h3>功能清单（'+Object.keys(I.features).length+' 个功能）</h3>';
        Object.keys(I.features).forEach(fk=>{h+=featureBlock(I.features[fk]);});
        return h;
      };
      Object.keys(I.features).forEach(fk=>{
        const f=I.features[fk];
        sections[key+'-'+fk]=()=>'<h2>'+esc(I.name)+' / '+esc(f.name)+'</h2><div class="sub">'+esc(I.id)+' → '+esc(f.id)+'</div>'+
          featureBlock(f)+'<a class="proto" style="margin-top:14px" data-back="'+key+'">← 返回 '+esc(I.name)+'</a>';
      });
    });
    return sections;
  }

  function mount(D, opts){
    opts = opts || {};
    const root=opts.rootId?document.getElementById(opts.rootId):document;
    const sidebar=root.querySelector('.pv-sidebar, #sidebar');
    const main=root.querySelector('.pv-main, #main');
    sidebar.querySelector('.brand h1').textContent=D.meta.name;
    sidebar.querySelector('.brand .ver').textContent=D.meta.version+' · 更新于 '+D.meta.updatedAt;
    const tip=root.querySelector('.updated'); if(tip) tip.textContent=D.meta.owner+' · '+D.meta.sourceDoc;

    const sections=buildSections(D);
    const ifaces=[['login',D.login],['center',D.center],['admin',D.admin]];
    let nh='<a data-t="common">📐 通用规则</a>';
    ifaces.forEach(([key,I])=>{
      nh+='<div class="iface">'+esc(I.name)+'</div>';
      nh+='<a class="feat" data-t="'+key+'">界面总览</a>';
      Object.keys(I.features).forEach(fk=>{nh+='<a class="feat" data-t="'+key+'-'+fk+'">'+esc(I.features[fk].name)+'</a>';});
    });
    const tree=sidebar.querySelector('#navTree');
    tree.innerHTML=nh;

    function show(t){
      main.innerHTML=sections[t]?sections[t]():sections['common']();
      tree.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.t===t));
      main.scrollTop?main.scrollTop=0:window.scrollTo(0,0);
    }
    tree.onclick=e=>{const a=e.target.closest('a');if(a&&a.dataset.t){if(opts.onNavigate)opts.onNavigate(a.dataset.t);else location.hash=a.dataset.t;}};
    main.addEventListener('click',e=>{
      const b=e.target.closest('[data-back]');if(b){if(opts.onNavigate)opts.onNavigate(b.dataset.back);else location.hash=b.dataset.back;}
    });
    if(opts.onNavigate){opts.onNavigate('common');}
    else{
      function route(){show(location.hash.slice(1)||'common');}
      window.addEventListener('hashchange',route);route();
    }
    return {show};
  }

  window.PRD_VIEWER={css:CSS,mount:mount,buildSections:buildSections};
})();
</script>
<script>
let DATA = window.PRD_DATA;
const editor = document.getElementById('jsonEditor');
editor.value = JSON.stringify(DATA, null, 2);
document.getElementById('pv-style').textContent = window.PRD_VIEWER.css;
document.getElementById('verLabel').textContent = DATA.meta.name + ' · ' + DATA.meta.version;

function status(msg, type){
  const el=document.getElementById('pvStatus');
  el.textContent=msg; el.className=type||'';
}
function applyData(silent){
  try{
    const d = JSON.parse(editor.value);
    if(!d.meta||!d.common||!d.interfaces&&(!d.login||!d.center||!d.admin)) throw new Error('缺少必要结构（meta/common/login/center/admin）');
    DATA = d;
    const nav=document.getElementById('pvRoot').querySelector('#navTree');
    nav.innerHTML='';
    window.PRD_VIEWER.mount(DATA, {rootId:null});
    // mount 默认查找 document 级别；上面手动挂载见下方
    if(!silent) status('已应用并重新渲染', 'ok');
  }catch(e){
    status('JSON 错误，未应用：'+e.message, 'err');
  }
}
/* 预览挂载：限定在 #pvRoot 内 */
function mountPreview(){
  const D=DATA, root=document.getElementById('pvRoot');
  root.querySelector('.brand h1').textContent=D.meta.name;
  root.querySelector('.brand .ver').textContent=D.meta.version+' · '+D.meta.updatedAt;
  root.querySelector('.updated').textContent=D.meta.owner+' · '+D.meta.sourceDoc;
  const sections=window.PRD_VIEWER.buildSections(D, window.marked);
  const tree=root.querySelector('#navTree');
  const main=root.querySelector('#main');
  const ifaces=[['login',D.login],['center',D.center],['admin',D.admin]];
  let nh='<a data-t="common">📐 通用规则</a>';
  ifaces.forEach(([key,I])=>{
    nh+='<div class="iface">'+I.name+'</div><a class="feat" data-t="'+key+'">界面总览</a>';
    Object.keys(I.features).forEach(fk=>{nh+='<a class="feat" data-t="'+key+'-'+fk+'">'+I.features[fk].name+'</a>';});
  });
  tree.innerHTML=nh;
  let api=null;
  function renderMermaid(){ /* 编辑预览中流程图以文本展示，避免加载外部库；查看版会懒加载 mermaid */ }
  function show(t){
    main.innerHTML=sections[t]?sections[t]():sections['common']();
    tree.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.t===t));
    renderMermaid();
  }
  tree.onclick=e=>{const a=e.target.closest('a');if(a&&a.dataset.t)show(a.dataset.t);};
  main.addEventListener('click',e=>{const b=e.target.closest('[data-back]');if(b)show(b.dataset.back);});
  show('common');
  api={show}; window._pvApi=api;
}
mountPreview();

/* 重新封装 applyData 使用自定义预览 */
applyData = function(silent){
  try{
    const d=JSON.parse(editor.value);
    if(!d.meta||!d.common||!d.login||!d.center||!d.admin) throw new Error('缺少必要结构（meta/common/login/center/admin）');
    DATA=d; mountPreview();
    status('已应用并重新渲染','ok');
  }catch(e){ status('JSON 错误，未应用：'+e.message,'err'); }
};

/* ---------- 构建查看版（与 build.js 同构） ---------- */
function buildViewerHtml(){
  const css=window.PRD_VIEWER.css;
  const dataJs='window.PRD_DATA = '+JSON.stringify(DATA,null,2)+';';
  const renderJs=window.__RENDER_SOURCE__||''; // 构建版注入
  return VIEWER_SHELL
    .replace('__TITLE__', DATA.meta.name)
    .replace('/*__PV_CSS__*/', css)
    .replace('/*__PRD_DATA__*/null;', dataJs)
    .replace('/*__RENDER_JS__*/', renderJs);
}
/* 开发态拿不到内联 render 源，用同步方式从同源文件取 */
const VIEWER_SHELL = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ · PRD</title>
<style id="pv-style">/*__PV_CSS__*/</style>
</head>
<body>
<nav id="sidebar" class="pv-sidebar">
  <div class="brand"><h1>PRD</h1><div class="ver"></div></div>
  <div id="navTree"></div>
</nav>
<main id="main" class="pv-main"></main>
<div class="updated"></div>
<script>window.PRD_DATA=/*__PRD_DATA__*/null;<\/script>
<script>/*__RENDER_JS__*/<\/script>
<script>window.PRD_VIEWER.mount(window.PRD_DATA);<\/script>
</body>
</html>`;

async function getRenderSource(){
  if(window.__RENDER_SOURCE__) return window.__RENDER_SOURCE__;
  const r=await fetch('viewer-render.js');
  return await r.text();
}

function download(name, content, type){
  const blob=new Blob([content],{type:type||'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function downloadData(){
  download('prd-data.js','/** 由 PRD 编辑器导出 '+new Date().toISOString()+' */\nwindow.PRD_DATA = '+JSON.stringify(DATA,null,2)+';\n','application/javascript');
}
async function downloadViewer(){
  const src=await getRenderSource();
  const html=VIEWER_SHELL
    .replace('__TITLE__',DATA.meta.name)
    .replace('/*__PV_CSS__*/',window.PRD_VIEWER.css)
    .replace('/*__PRD_DATA__*/null;','window.PRD_DATA = '+JSON.stringify(DATA,null,2)+';')
    .replace('/*__RENDER_JS__*/',src);
  download('viewer-complete.html',html);
}

/* ---------- GitHub 发布 ---------- */
const CFG_KEY='prd_github_cfg';
(function(){
  try{const c=JSON.parse(localStorage.getItem(CFG_KEY)||'{}');
    if(c.user)document.getElementById('ghUser').value=c.user;
    if(c.repo)document.getElementById('ghRepo').value=c.repo;
    if(c.path)document.getElementById('ghPath').value=c.path;
    if(c.token)document.getElementById('ghToken').value=c.token;
  }catch(e){}
})();
function openPub(){document.getElementById('pubMask').classList.add('open');}
function closePub(){document.getElementById('pubMask').classList.remove('open');}
function pubLog(s){document.getElementById('pubLog').textContent+=s+'\n';}
async function api(path, opt){
  const token=document.getElementById('ghToken').value.trim();
  const res=await fetch('https://api.github.com'+path,Object.assign({
    headers:Object.assign({'Authorization':'token '+token,'Accept':'application/vnd.github+json','User-Agent':'prd-publisher'},(opt&&opt.headers)||{}),
  },opt||{}));
  if(!res.ok){let msg='HTTP '+res.status;try{msg+=' '+(await res.json()).message||'';}catch(e){}throw new Error(msg);}
  return res.status===204?null:res.json();
}
async function publish(){
  const user=document.getElementById('ghUser').value.trim();
  const repo=document.getElementById('ghRepo').value.trim();
  const path=document.getElementById('ghPath').value.trim()||'index.html';
  const msg=document.getElementById('ghMsg').value.trim()||'更新 PRD 查看版';
  const isPrivate=document.getElementById('ghPrivate').checked;
  if(!user||!repo||!document.getElementById('ghToken').value.trim()){pubLog('请填写用户名、仓库名和 Token');return;}
  localStorage.setItem(CFG_KEY,JSON.stringify({user,repo,path,token:document.getElementById('ghToken').value.trim()}));
  document.getElementById('pubLog').textContent='';
  document.getElementById('pubBtn').disabled=true;
  try{
    applyData(true);
    pubLog('① 正在生成查看版 HTML…');
    const src=await getRenderSource();
    const html=VIEWER_SHELL
      .replace('__TITLE__',DATA.meta.name)
      .replace('/*__PV_CSS__*/',window.PRD_VIEWER.css)
      .replace('/*__PRD_DATA__*/null;','window.PRD_DATA = '+JSON.stringify(DATA,null,2)+';')
      .replace('/*__RENDER_JS__*/',src);
    pubLog('  HTML 大小 '+(html.length/1024).toFixed(1)+' KB，Token 检查：'+(html.includes(document.getElementById('ghToken').value.trim())?'⚠️ 含 token！已中止':'✅ 不含 token'));

    pubLog('② 检查仓库 '+user+'/'+repo+' …');
    let exists=true,repoInfo=null;
    try{repoInfo=await api('/repos/'+user+'/'+repo);}catch(e){exists=false;}
    if(!exists){
      pubLog('  仓库不存在，正在创建（'+(isPrivate?'私有':'公开')+'）…');
      repoInfo=await api('/user/repos',{method:'POST',body:JSON.stringify({name:repo,private:isPrivate,auto_init:false})});
    }

    pubLog('③ 上传 '+path+' …');
    let sha=null;
    try{const cur=await api('/repos/'+user+'/'+repo+'/contents/'+path);sha=cur.sha;}catch(e){}
    const payload={message:msg,content:b64Utf8(html)};
    if(sha)payload.sha=sha;
    await api('/repos/'+user+'/'+repo+'/contents/'+path,{method:'PUT',body:JSON.stringify(payload)});
    pubLog(sha?'  已更新（sha '+(sha||'').slice(0,7)+'）':'  已创建');

    pubLog('④ 启用 GitHub Pages…');
    try{
      await api('/repos/'+user+'/'+repo+'/pages',{method:'POST',body:JSON.stringify({source:{branch:'main',path:'/'}})});
      pubLog('  Pages 已启用');
    }catch(e){
      if(String(e.message).includes('409')||String(e.message).includes('201')===false&&/already|409/.test(e.message)) pubLog('  Pages 已处于启用状态');
      else pubLog('  ⚠️ Pages 启用提示：'+e.message+'（可到仓库 Settings→Pages 手动开启，源选 main / root）');
    }
    const url='https://'+user+'.github.io/'+repo+'/'+(path==='index.html'?'':path);
    pubLog('✅ 发布完成！几分钟后访问：\n'+url);
  }catch(e){
    pubLog('❌ 失败：'+e.message);
  }finally{
    document.getElementById('pubBtn').disabled=false;
  }
}
/* Unicode 安全 base64 */
function b64Utf8(str){return btoa(unescape(encodeURIComponent(str)));}
editor.addEventListener('input',()=>{document.getElementById('charCount').textContent=(editor.value.length)+' 字符';});
document.getElementById('charCount').textContent=editor.value.length+' 字符';
</script>
